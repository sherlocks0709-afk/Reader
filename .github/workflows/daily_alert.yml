name: NASDAQ Daily Risk Alert

on:
  schedule:
    # UTC 기준 00:00 = 한국 시간(KST) 매일 오전 9:00
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  run-risk-analyzer:
    runs-on: ubuntu-latest
    steps:
      - name: 저장소 코드 불러오기
        uses: actions/checkout@v4

      - name: Python 환경 설정
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 필수 라이브러리 설치
        run: |
          pip install yfinance pandas numpy requests

      - name: 고점 판독기 실행 및 텔레그램 발송
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: |
          python nasdaq_monitor.py
