name: Nasdaq QQQ Daily Ultra Monitor

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-monitor:
    runs-on: ubuntu-latest
    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4

      - name: 파이썬 환경 설정
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 패키지 설치
        run: |
          pip install requests pandas numpy

      - name: 모니터링 실행 및 자체 DB 누적
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: |
          python nasdaq_monitor.py

      - name: 자체 누적 DB 깃허브 자동 커밋 및 푸시
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add history_db.csv
          git diff --quiet && git diff --staged --quiet || (git commit -m "📊 [Auto-DB] $(date +'%Y-%m-%d') 지표 데이터 자동 누적" && git push)
