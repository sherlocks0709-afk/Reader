name: Daily Macro Alert & DB Update

on:
  schedule:
    # 한국 시간 화~토 아침 07:13 (UTC 월~금 22:13)
    - cron: '13 22 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-analysis:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # 전체 히스토리 가져오기

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install yfinance pandas numpy requests

      - name: Run Alert Script
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python daily_macro_alert.py

      - name: Commit and push history_db.csv
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add history_db.csv
          if git diff --staged --quiet; then
            echo "변경 사항이 없어 커밋을 건너뜁니다."
          else
            git commit -m "Update history_db.csv [skip ci]"
            git pull --rebase origin main || git pull --rebase origin master || true
            git push origin HEAD || echo "Push 실패 방지 처리 완료"
          fi
