- name: Run DB Generator
        run: |
          python perfect_walkforward_backtest.py
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}

      # 👇 이 부분이 있어야 실행 후 내 GitHub 저장소 메인에 파일이 영구 저장됩니다.
      - name: Commit and Push DB to Repository
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add backtest_raw_db.csv
          git commit -m "📦 Auto-update backtest_raw_db.csv" || echo "No changes to commit"
          git push
